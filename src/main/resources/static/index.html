<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenAI STT - Speech to Text</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        button { margin: 5px; padding: 10px 18px; cursor: pointer; font-size: 14px; }
        #status { font-weight: bold; color: #555; margin-top: 10px; }
        #result { margin-top: 20px; padding: 10px; background: #f4f4f4; border-radius: 4px; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="container">
    <h2>Speech-to-Text Recorder</h2>
    
    <div>
        <button id="recordBtn" onclick="startRecording()">Record Audio</button>
        <button id="stopBtn" onclick="stopRecording()" disabled>Stop Recording</button>
    </div>

    <div id="status">Status: Idle</div>

    <h3>Transcription Result:</h3>
    <div id="result">Waiting for recording...</div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];

    async function startRecording() {
        audioChunks = [];
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                await sendAudioToServer(audioBlob);
            };

            mediaRecorder.start();
            document.getElementById('status').innerText = 'Status: Recording started...';
            document.getElementById('recordBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
        } catch (err) {
            document.getElementById('status').innerText = 'Status: Microphone access failed - ' + err.message;
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            document.getElementById('status').innerText = 'Status: Recording stopped. Transcribing...';
            document.getElementById('recordBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
    }

    async function sendAudioToServer(blob) {
        const formData = new FormData();
        formData.append('file', blob, 'recording.wav');

        try {
            const response = await fetch('/api/v1/transcribe', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (response.ok) {
                document.getElementById('result').innerText = data.text || 'No text transcribed.';
                document.getElementById('status').innerText = 'Status: Idle';
            } else {
                document.getElementById('result').innerText = 'Error: ' + (data.error || 'Request failed.');
                document.getElementById('status').innerText = 'Status: Error occurred';
            }
        } catch (err) {
            document.getElementById('result').innerText = 'Network error: ' + err.message;
            document.getElementById('status').innerText = 'Status: Network error';
        }
    }
</script>
</body>
</html>
