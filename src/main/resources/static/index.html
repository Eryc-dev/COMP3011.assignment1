<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio STT Recorder</title>
</head>
<body>
    <h1>Audio Recorder</h1>
    <button id="recordButton">Record Audio</button>
    <button id="stopButton" disabled>Stop Recording</button>
    <p>Status: <span id="status">Idle</span></p>
    <h3>Transcription:</h3>
    <p id="result"></p>

    <script>
        let mediaRecorder;
        let audioChunks = [];

        const recordButton = document.getElementById('recordButton');
        const stopButton = document.getElementById('stopButton');
        const statusSpan = document.getElementById('status');
        const resultParagraph = document.getElementById('result');

        recordButton.addEventListener('click', async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const formData = new FormData();
                formData.append('file', audioBlob, 'recording.wav');

                try {
                    const response = await fetch('/api/v1/transcribe', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    if (data.text) {
                        resultParagraph.innerText = data.text;
                        statusSpan.innerText = 'Transcription completed';
                    } else {
                        statusSpan.innerText = 'Error occurred';
                        resultParagraph.innerText = data.error || 'Unknown error';
                    }
                } catch (error) {
                    statusSpan.innerText = 'Error occurred';
                    resultParagraph.innerText = error.message;
                }
                
                audioChunks = [];
            };

            mediaRecorder.start();
            statusSpan.innerText = 'Recording started...';
            recordButton.disabled = true;
            stopButton.disabled = false;
        });

        stopButton.addEventListener('click', () => {
            mediaRecorder.stop();
            statusSpan.innerText = 'Processing...';
            recordButton.disabled = false;
            stopButton.disabled = true;
        });
    </script>
</body>
</html>
