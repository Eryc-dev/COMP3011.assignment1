# Default configuration - used as-is on TITAN (java -jar with no profile).
spring.application.name=Assignment1
server.port=8080

# --- Concurrency -------------------------------------------------------------
# Handle each request on a Java virtual thread so >200 concurrent blocking calls
# to OpenAI do not exhaust Tomcat's platform thread pool or block other requests.
spring.threads.virtual.enabled=true

# --- Graceful shutdown -------------------------------------------------------
# Let in-flight requests finish when /api/v1/admin/shutdown closes the context.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Uploads -----------------------------------------------------------------
# OpenAI accepts files up to 25 MB; Spring's default limit is only 1 MB.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# --- OpenAI ------------------------------------------------------------------
# The API key is NOT configured here: it is read at runtime from the
# OPENAI_API_KEY environment variable (see OpenAiClientConfig).
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.connect-timeout-seconds=5
openai.read-timeout-seconds=60

logging.level.root=INFO

# Process exit code after /api/v1/admin/shutdown. Set to 1 temporarily to make TITAN print
# stdout/stderr for debugging; must be 0 for a clean graceful exit.
app.shutdown-exit-code=0
